name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests
        run: python -m unittest discover -s tests -v

  # The admin (Django) is a separate job so the site tests above keep proving
  # that the site builds with the standard library alone.
  admin-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-admin.txt
      - name: Install admin dependencies
        run: pip install -r requirements-admin.txt
      - name: Run admin tests
        run: python cms/manage.py test press -v 2
