{% extends "admin/base_site.html" %}
{% block content %}
<p>公開済みの記事を書き出し、サイトのテストを実行し、問題がなければ GitHub に PR（変更の提案）を作成します。</p>
<p>サイトに反映されるのは、GitHub でその PR をマージしたときです。</p>
<form method="post">{% csrf_token %}
  <input type="submit" value="サイトに反映">
  <a href="{% url 'admin:press_article_changelist' %}">キャンセル</a>
</form>
{% endblock %}
